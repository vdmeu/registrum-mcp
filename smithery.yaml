# Smithery MCP registry configuration
# https://smithery.ai

name: Registrum — Companies House API
description: >
  UK Companies House data without the plumbing. Search companies, pull enriched
  profiles, structured financials parsed from iXBRL filings, directors with full
  appointment history, PSC registers with control types decoded, ownership chains
  traced to ultimate beneficial owners, ECCTA compliance and identity-verification status ahead
  of the 18 November 2026 deadline, and director-network graphs. No Companies
  House developer key, no rate-limit handling, no iXBRL parsing - one Registrum
  API key.

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      apiKey:
        type: string
        description: Your Registrum API key (get one free at registrum.co.uk/?utm_source=mcp&utm_campaign=smithery)
    required:
      - apiKey
  commandFunction: |-
    (config) => ({
      command: "npx",
      args: ["-y", "@registrum/mcp"],
      env: { REGISTRUM_API_KEY: config.apiKey }
    })
