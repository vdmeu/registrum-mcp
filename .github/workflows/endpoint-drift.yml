name: API contract drift

# Answers "how do future API changes reach this package?"
#
# docs/CROSS-PROJECT-IMPACT.md already required a matching tool for every new
# GET endpoint, rated high priority. /compliance shipped anyway and this
# package went five months without it. A prose rule was not the control, so
# this is: a scheduled check against the LIVE API that opens an issue when the
# package falls behind. It needs nobody to remember anything.
#
# It checks the seam at two granularities, because the first one alone was
# green while search_company sent ?limit=N to an API that declares
# items_per_page (registrum-mcp#5):
#   endpoint - does a tool exist for every endpoint?
#   parameter - does each tool send names the endpoint actually declares?

on:
  schedule:
    - cron: "0 8 * * 1"   # Mondays 08:00 UTC
  workflow_dispatch:
  pull_request:            # also blocks a PR that breaks the contract

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build   # check-param-drift.mjs drives the built tools

      - name: Check every API endpoint has an MCP tool
        id: endpoints
        run: node scripts/check-endpoint-coverage.mjs 2>&1 | tee coverage.txt
        continue-on-error: true

      - name: Check every parameter a tool sends is declared by the API
        id: params
        run: node scripts/check-param-drift.mjs 2>&1 | tee -a coverage.txt
        continue-on-error: true

      - name: Open an issue when the package has drifted from the API
        if: (steps.endpoints.outcome == 'failure' || steps.params.outcome == 'failure') && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One open issue at a time - re-running weekly must not spam.
          existing=$(gh issue list --label endpoint-drift --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still drifting as of $(date -u +%F):

          \`\`\`
          $(cat coverage.txt)
          \`\`\`"
          else
            gh issue create \
              --title "MCP package has drifted from the API contract" \
              --label endpoint-drift \
              --body "This package and the API no longer agree - either an endpoint has no tool, or a tool sends a parameter name the endpoint does not declare (which FastAPI drops silently, so nobody sees an error).

          \`\`\`
          $(cat coverage.txt)
          \`\`\`

          Fix \`src/server.ts\`, or waive a missing endpoint with a reason in \`WAIVED\` (\`scripts/check-endpoint-coverage.mjs\`). Then release with \`gh workflow run publish.yml\`."
          fi

      - name: Fail the run so the drift is visible
        if: steps.endpoints.outcome == 'failure' || steps.params.outcome == 'failure'
        run: exit 1
