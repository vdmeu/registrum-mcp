name: API endpoint drift

# Answers "how do future API changes reach this package?"
#
# docs/CROSS-PROJECT-IMPACT.md already required a matching tool for every new
# GET endpoint, rated high priority. /compliance shipped anyway and this
# package went five months without it. A prose rule was not the control, so
# this is: a scheduled check against the LIVE API that opens an issue when the
# package falls behind. It needs nobody to remember anything.

on:
  schedule:
    - cron: "0 8 * * 1"   # Mondays 08:00 UTC
  workflow_dispatch:
  pull_request:            # also blocks a PR that adds an endpoint without a tool

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check every API endpoint has an MCP tool
        id: check
        run: node scripts/check-endpoint-coverage.mjs 2>&1 | tee coverage.txt
        continue-on-error: true

      - name: Open an issue when the package has fallen behind
        if: steps.check.outcome == 'failure' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # One open issue at a time - re-running weekly must not spam.
          existing=$(gh issue list --label endpoint-drift --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still drifting as of $(date -u +%F):

          \`\`\`
          $(cat coverage.txt)
          \`\`\`"
          else
            gh issue create \
              --title "MCP package is missing tools for new API endpoints" \
              --label endpoint-drift \
              --body "The API exposes endpoints this package has no tool for, so developers discovering us through MCP cannot see those features.

          \`\`\`
          $(cat coverage.txt)
          \`\`\`

          Add a tool in \`src/server.ts\`, or waive it with a reason in \`WAIVED\` (\`scripts/check-endpoint-coverage.mjs\`). Then release with \`gh workflow run publish.yml\`."
          fi

      - name: Fail the run so the drift is visible
        if: steps.check.outcome == 'failure'
        run: exit 1
